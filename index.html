<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Ward | Blog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="home.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div id="nav-placeholder"></div>
    </header>

    <main class="hero">
        <div class="hero__media">
            <img class="hero__image" src="photo.jpg" alt="" aria-hidden="true">
            <video class="hero__video" autoplay loop muted playsinline poster="photo.jpg">
                <source src="movie.mp4" type="video/mp4">
                Your browser does not support HTML5 video.
            </video>
            <audio id="bgmusic" class="hero__audio" src="audio.mp3" autoplay preload="none">
                Your browser does not support the audio element.
            </audio>
        </div>
        <button id="audioControl" class="audio-toggle" type="button">Play audio</button>

        <div class="personal-info">
            <h1>David Ward</h1>
            <p>Network Administrator at Warfel Construction</p>
        </div>
    </main>

    <footer class="site-footer">
        <p>Welcome to my journey</p>
    </footer>
</body>

</html>
